services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hetu-postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=hetu_agent
      - POSTGRES_USER=hetu_user
      - POSTGRES_PASSWORD=hetu_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hetu_user -d hetu_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hetu-network
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    # Note: Qdrant image doesn't include curl, so we use a simple process check
    # Health check is disabled, relying on service availability
    networks:
      - hetu-network

  # FastAPI Application
  api:
    build:
      context: ./agent_service
      dockerfile: Dockerfile
    container_name: hetu-agent-api
    ports:
      - "6000:8000"
    volumes:
      # Mount source code for development
      - ./agent_service/src:/app/src:ro
      - ./agent_service/test_twitter_fetch.py:/app/test_twitter_fetch.py:ro
      - ./scripts:/app/scripts:ro
      - ./.env:/app/.env:ro
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MCP_URL=http://mcp:6001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=hetu_agent
      - POSTGRES_USER=hetu_user
      - POSTGRES_PASSWORD=hetu_password
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      mcp:
        condition: service_started
    networks:
      - hetu-network
    restart: unless-stopped

  # MCP Server
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: hetu-mcp-server
    ports:
      - "6001:6001"
    volumes:
      # Mount source code for development
      - ./mcp/src:/app/src:ro
      - ./.env:/app/.env:ro
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - hetu-network
    restart: unless-stopped

networks:
  hetu-network:
    driver: bridge


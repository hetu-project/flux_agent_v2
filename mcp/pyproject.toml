[tool.poetry]
name = "hetu-mcp"
version = "0.1.0"
description = "MCP Server for Hetu Agent"
authors = ["Litterpigger <litterpigger@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
qdrant-client = "^1.7.0"
openai = "^1.3.0"
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.5.0"
httpx = "^0.28.1"
fastmcp = "^2.13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.11.0"
ruff = "^0.1.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

